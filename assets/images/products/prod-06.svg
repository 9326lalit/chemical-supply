<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 320" width="400" height="320">
    <defs>
      <linearGradient id="pbg-prod-06" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#F8FAFC"/>
        <stop offset="100%" stop-color="#E2E8F0"/>
      </linearGradient>
      <linearGradient id="pcon-prod-06" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#1E3A5F"/>
        <stop offset="100%" stop-color="#111827"/>
      </linearGradient>
    </defs>
    <rect width="400" height="320" fill="url(#pbg-prod-06)"/>
    <!-- Subtle technical grid -->
    <path d="M0 80h400M0 160h400M0 240h400M80 0v320M160 0v320M240 0v320M320 0v320" stroke="#CBD5E1" stroke-width="0.8" stroke-dasharray="3 3"/>
    
    <!-- Industrial Product Packaging Illustration -->
    <g transform="translate(130, 45)">
      <!-- Shadow -->
      <ellipse cx="70" cy="235" rx="65" ry="14" fill="#64748B" fill-opacity="0.3"/>
      
      <!-- Container body -->
      <rect x="15" y="40" width="110" height="180" rx="14" fill="url(#pcon-prod-06)" stroke="#0F172A" stroke-width="2"/>
      
      <!-- Top lid / handle -->
      <path d="M40 38 C40 25, 100 25, 100 38" fill="none" stroke="#F97316" stroke-width="5" stroke-linecap="round"/>
      <rect x="25" y="36" width="90" height="12" rx="4" fill="#334155"/>
      
      <!-- Container Label Band -->
      <rect x="16" y="85" width="108" height="95" fill="#FFFFFF"/>
      <rect x="16" y="85" width="108" height="8" fill="#F97316"/>
      <rect x="24" y="100" width="40" height="10" rx="2" fill="#1E3A5F"/>
      <text x="27" y="108" font-family="'Inter', sans-serif" font-size="7" font-weight="800" fill="#FFFFFF">INDUSTRIAL</text>
      <text x="24" y="125" font-family="'Inter', sans-serif" font-size="11" font-weight="800" fill="#111827">IR-10</text>
      
      <!-- Technical bar code graphics -->
      <line x1="24" y1="135" x2="24" y2="155" stroke="#111827" stroke-width="2"/>
      <line x1="28" y1="135" x2="28" y2="155" stroke="#111827" stroke-width="1"/>
      <line x1="32" y1="135" x2="32" y2="155" stroke="#111827" stroke-width="3"/>
      <line x1="38" y1="135" x2="38" y2="155" stroke="#111827" stroke-width="1.5"/>
      <line x1="42" y1="135" x2="42" y2="155" stroke="#111827" stroke-width="2"/>
      <line x1="48" y1="135" x2="48" y2="155" stroke="#111827" stroke-width="4"/>

      <!-- Quality Seal badge -->
      <circle cx="95" cy="140" r="16" fill="#F8FAFC" stroke="#0D9488" stroke-width="2"/>
      <path d="M89 140l4 4 9-9" fill="none" stroke="#F97316" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Bottom ring -->
      <rect x="20" y="210" width="100" height="8" rx="2" fill="#1E3A5F"/>
    </g>
    
    <!-- Corner specification tag -->
    <rect x="20" y="20" width="110" height="24" rx="4" fill="#FFFFFF" stroke="#E2E8F0"/>
    <circle cx="32" cy="32" r="4" fill="#F97316"/>
    <text x="42" y="36" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#1E3A5F">ISO CERTIFIED SPEC</text>
  </svg>